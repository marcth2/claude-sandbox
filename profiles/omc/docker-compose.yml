services:
  claude:
    build:
      context: ../..
      dockerfile: profiles/omc/Dockerfile
      args:
        DOCKER_GID: ${DOCKER_GID:-984}
        USERNAME: ${CONTAINER_USER:-claude}
        USER_UID: ${CONTAINER_UID:-1000}
        USER_GID: ${CONTAINER_GID:-1000}
    image: claude-code:omc
    stdin_open: true
    tty: true
    environment:
      - HOME=/home/${CONTAINER_USER:-claude}
      - BROWSER=echo
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
